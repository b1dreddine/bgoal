name: livescores # internal package name (imports); the app is called BGoal
description: BGoal - live football scores with goal notifications.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: any # version is pinned by flutter_localizations
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  flutter_timezone: ^3.0.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.2
  google_mobile_ads: ^6.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mark_green.png

# dart run flutter_launcher_icons   (images come from tool/brand/make_icons.py)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  remove_alpha_ios: true
  min_sdk_android: 26
  adaptive_icon_background: "#0E8A4A"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0E8A4A"
  image: assets/brand/splash.png
  android_12:
    color: "#0E8A4A"
    image: assets/brand/splash_android12.png
  fullscreen: false
