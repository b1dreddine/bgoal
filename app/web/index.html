<!DOCTYPE html>
<html>
<head>
  <!-- `flutter build web --base-href /<repo>/` fills this in (see WEB_TESTING.md). -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BGoal: live football scores and goal alerts.">
  <meta name="theme-color" content="#0E8A4A">
  <!-- Home Screen app on iPhone: own icon and name, no Safari bars. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BGoal">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>BGoal</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0E8A4A; }
    #splash, #guide { position: fixed; inset: 0; z-index: 10; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #splash { display: grid; place-items: center; background: #0E8A4A; transition: opacity .25s; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash.done { opacity: 0; pointer-events: none; }

    #guide { overflow-y: auto; background: #F4F8F5; color: #13201A; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    #guide[hidden] { display: none; }
    .top { background: #0E8A4A; color: #fff; text-align: center; padding: 28px 20px 24px; }
    .top img { width: 72px; height: 72px; border-radius: 17px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
    .top h1 { margin: 12px 0 4px; font-size: 24px; line-height: 1.2; }
    .top p { margin: 0 auto; max-width: 30em; opacity: .9; font-size: 15px; }
    ol { list-style: none; margin: 0 auto; padding: 18px 16px 8px; max-width: 460px; display: grid; gap: 10px; }
    li { background: #fff; border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; box-shadow: 0 1px 2px rgba(19,32,26,.08); }
    li b.n { width: 30px; height: 30px; border-radius: 50%; background: #0E8A4A; color: #fff; display: grid; place-items: center; font-size: 15px; }
    li p { margin: 4px 0 0; }
    li small { display: block; color: #5B6B62; margin-top: 4px; font-size: 13.5px; }
    .ico { display: inline-grid; place-items: center; vertical-align: -6px; width: 26px; height: 26px; border-radius: 6px; background: #EAF1EC; color: #0A7AFF; margin: 0 2px; }
    .ico svg { width: 18px; height: 18px; }
    .actions { max-width: 460px; margin: 0 auto; padding: 8px 16px 24px; display: grid; gap: 8px; }
    button { font: inherit; border: 0; border-radius: 24px; padding: 13px 18px; cursor: pointer; }
    #install { background: #0E8A4A; color: #fff; font-weight: 600; }
    #later { background: transparent; color: #0E6B3A; text-decoration: underline; }
    [dir="rtl"] li { text-align: right; }
    @media (prefers-color-scheme: dark) {
      #guide { background: #0F1511; color: #E1E8E2; }
      li { background: #1A221D; box-shadow: none; }
      li small { color: #A6B3AA; }
      .ico { background: #26302A; color: #4FA3FF; }
      #later { color: #8DD79F; }
    }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>

  <!-- Shown when a phone opens the link in a browser tab rather than from the Home Screen. -->
  <div id="guide" hidden>
    <div class="top">
      <img src="icons/Icon-192.png" alt="">
      <h1 data-t="title"></h1>
      <p data-t="intro"></p>
    </div>
    <ol id="steps"></ol>
    <div class="actions">
      <button id="install" hidden data-t="install"></button>
      <button id="later" data-t="later"></button>
    </div>
  </div>

  <script>
  {
    const share = '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M8 11H6v10h12V11h-2"/></svg></span>';
    const addHome = '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>';
    const dots = '<span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span>';
    const vdots = '<span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>';

    const text = {
      en: {
        title: 'Add BGoal to your Home Screen', intro: 'It takes 20 seconds. BGoal then opens like a normal app, full screen, with its own icon.',
        inApp: ['Open this page in Safari', 'You opened the link inside another app. Tap ' + dots + ' or the compass icon, then <b>Open in Safari</b>.'],
        iosShare: ['Tap the Share button ' + share, 'At the bottom of Safari (top right in Chrome). Don\'t see it? Tap ' + dots + ' first.'],
        iosAdd: ['Tap <b>Add to Home Screen</b> ' + addHome, 'Scroll down the list if you don\'t see it.'],
        iosConfirm: ['Tap <b>Add</b>', 'If you see "Open as Web App", leave it on.'],
        open: ['Open BGoal from your Home Screen', 'You can close this tab.'],
        androidMenu: ['Tap the menu ' + vdots, 'In Chrome, at the top right.'],
        androidAdd: ['Tap <b>Add to Home screen</b> or <b>Install app</b>', ''],
        install: 'Install BGoal', later: 'Continue in the browser'
      },
      fr: {
        title: 'Ajoutez BGoal à votre écran d\'accueil', intro: 'Cela prend 20 secondes. BGoal s\'ouvre ensuite comme une vraie app, en plein écran, avec son icône.',
        inApp: ['Ouvrez cette page dans Safari', 'Vous avez ouvert le lien dans une autre app. Touchez ' + dots + ' ou la boussole, puis <b>Ouvrir dans Safari</b>.'],
        iosShare: ['Touchez le bouton Partager ' + share, 'En bas de Safari (en haut à droite dans Chrome). Vous ne le voyez pas ? Touchez d\'abord ' + dots + '.'],
        iosAdd: ['Touchez <b>Sur l\'écran d\'accueil</b> ' + addHome, 'Faites défiler la liste si vous ne le voyez pas.'],
        iosConfirm: ['Touchez <b>Ajouter</b>', 'Si vous voyez « Ouvrir comme app web », laissez-le activé.'],
        open: ['Ouvrez BGoal depuis votre écran d\'accueil', 'Vous pouvez fermer cet onglet.'],
        androidMenu: ['Touchez le menu ' + vdots, 'Dans Chrome, en haut à droite.'],
        androidAdd: ['Touchez <b>Ajouter à l\'écran d\'accueil</b> ou <b>Installer l\'appli</b>', ''],
        install: 'Installer BGoal', later: 'Continuer dans le navigateur'
      },
      ar: {
        title: 'أضف BGoal إلى الشاشة الرئيسية', intro: 'يستغرق ذلك 20 ثانية. بعدها يفتح BGoal كتطبيق عادي بملء الشاشة وبأيقونته الخاصة.',
        inApp: ['افتح هذه الصفحة في Safari', 'فتحت الرابط داخل تطبيق آخر. اضغط ' + dots + ' أو أيقونة البوصلة، ثم <b>فتح في Safari</b>.'],
        iosShare: ['اضغط زر المشاركة ' + share, 'أسفل Safari (أعلى اليمين في Chrome). لا تراه؟ اضغط ' + dots + ' أولًا.'],
        iosAdd: ['اضغط <b>إضافة إلى الشاشة الرئيسية</b> ' + addHome, 'مرّر القائمة إلى الأسفل إن لم تجده.'],
        iosConfirm: ['اضغط <b>إضافة</b>', 'إذا ظهر خيار "فتح كتطبيق ويب" فاتركه مفعّلًا.'],
        open: ['افتح BGoal من الشاشة الرئيسية', 'يمكنك إغلاق هذه الصفحة.'],
        androidMenu: ['اضغط القائمة ' + vdots, 'في Chrome، أعلى اليمين.'],
        androidAdd: ['اضغط <b>إضافة إلى الشاشة الرئيسية</b> أو <b>تثبيت التطبيق</b>', ''],
        install: 'ثبّت BGoal', later: 'المتابعة في المتصفح'
      }
    };

    const ua = navigator.userAgent;
    const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const android = /Android/.test(ua);
    const installed = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    const inAppBrowser = /FBAN|FBAV|Instagram|Snapchat|musical_ly|TikTok|LinkedInApp|Line\/|GSA\//.test(ua);
    let dismissed = false;
    try { dismissed = sessionStorage.getItem('bgoal-guide') === 'later'; } catch (e) {}

    let started = false;
    function startApp() {
      if (started) return;
      started = true;
      const s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    }
    // Flutter fires this once the app has drawn its first screen.
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash').classList.add('done'));

    if (installed || dismissed || !(ios || android)) {
      startApp();
    } else {
      const lang = (navigator.language || 'en').slice(0, 2);
      const t = text[lang] || text.en;
      if (lang === 'ar') document.getElementById('guide').dir = 'rtl';
      const keys = ios
        ? [...(inAppBrowser ? ['inApp'] : []), 'iosShare', 'iosAdd', 'iosConfirm', 'open']
        : ['androidMenu', 'androidAdd', 'open'];
      document.getElementById('steps').innerHTML = keys.map((k, i) =>
        '<li><b class="n">' + (i + 1) + '</b><div><p>' + t[k][0] + '</p>' + (t[k][1] ? '<small>' + t[k][1] + '</small>' : '') + '</div></li>').join('');
      document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t[el.dataset.t]; });
      document.getElementById('guide').hidden = false;

      // Android Chrome can install in one tap.
      let prompt = null;
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        prompt = e;
        document.getElementById('install').hidden = false;
      });
      document.getElementById('install').addEventListener('click', async () => {
        if (!prompt) return;
        prompt.prompt();
        await prompt.userChoice;
        prompt = null;
        document.getElementById('install').hidden = true;
      });
      document.getElementById('later').addEventListener('click', () => {
        try { sessionStorage.setItem('bgoal-guide', 'later'); } catch (e) {}
        document.getElementById('guide').hidden = true;
        startApp();
      });
    }
  }
  </script>
</body>
</html>
